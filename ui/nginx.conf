server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API isteklerini backend'e proxy'le
    # Docker DNS resolver ile container adı çözümlenir
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://pgstat-api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Grafana — sub-path mount, ayni port uzerinden, AUTO-LOGIN
    # Gercek Grafana path'leri: /grafana/d/, /grafana/api/, /grafana/public/, /grafana/login
    # pgstat UI'in /grafana/:uid route'u (embed sayfasi) SPA'ya duser (try_files)
    location /grafana/d/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://pgstat-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER admin;
        proxy_set_header X-WEBAUTH-NAME "pgstat admin";
        proxy_set_header X-WEBAUTH-ROLE Admin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /grafana/api/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://pgstat-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER admin;
        proxy_set_header X-WEBAUTH-NAME "pgstat admin";
        proxy_set_header X-WEBAUTH-ROLE Admin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /grafana/public/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://pgstat-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /grafana/login {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://pgstat-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER admin;
        proxy_set_header X-WEBAUTH-NAME "pgstat admin";
        proxy_set_header X-WEBAUTH-ROLE Admin;
    }

    # Grafana Live (WebSocket) — anlik panel guncellemeleri icin
    location /grafana/api/live/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://pgstat-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER admin;
        proxy_set_header X-WEBAUTH-NAME "pgstat admin";
        proxy_set_header X-WEBAUTH-ROLE Admin;
    }
}
