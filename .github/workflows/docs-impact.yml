name: Docs Impact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  docs-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate documentation inventory
        run: node scripts/generate-doc-inventory.mjs

      - name: Fail on generated documentation drift
        run: |
          git diff --exit-code -- \
            docs/generated/project-inventory.md \
            docs/generated/data-lifecycle-matrix.md \
            docs/generated/data-family-contracts.md \
            docs/generated/field-contracts.md \
            docs/generated/contract-review-queue.md

      - name: Check documentation impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-doc-impact.mjs --base=origin/${{ github.base_ref }}
          else
            node scripts/check-doc-impact.mjs --base=HEAD~1
          fi
